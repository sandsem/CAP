name: Appliquer les corrections finales à CAP V14

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v14-candidate-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche candidate
        uses: actions/checkout@v4
        with:
          ref: v14-candidate
          fetch-depth: 0

      - name: Appliquer les corrections validées
        run: |
          base64 -d cap_fixes.patch.gz.b64 | gzip -d > /tmp/cap_fixes.patch
          git apply --check /tmp/cap_fixes.patch
          git apply /tmp/cap_fixes.patch

      - name: Enregistrer les corrections sur v14-candidate
        run: |
          git config user.name "CAP Audit"
          git config user.email "actions@users.noreply.github.com"
          git add app.py config.py pdf_export.py research.py scoring.py tests/test_app.py tests/test_pdf.py tests/test_reference_scenarios.py tests/test_scoring.py
          git commit -m "Corriger la restitution et la hiérarchie de décision"
          git push origin HEAD:v14-candidate
